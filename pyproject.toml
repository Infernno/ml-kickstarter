[project]
name = "ml-kickstarter"
version = "0.1.0"
description = "Kickstarter campaign success prediction"
readme = "README.md"
authors = [
    { name = "Infernno", email = "7915327+Infernno@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dvc[s3]>=3.67.1",
    "fire>=0.7.1",
    "hydra-core>=1.3.8",
    "joblib>=1.6.0",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "omegaconf>=2.3.1",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[project.scripts]
ml-kickstarter = "ml_kickstarter.commands:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
