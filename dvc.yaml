stages:
  preprocess:
    cmd: uv run ml-kickstarter preprocess
    deps:
      - pyproject.toml
      - uv.lock
      - data/raw/dataset.csv
      - configs/config.yaml
      - configs/data/kickstarter.yaml
      - src/ml_kickstarter/commands.py
      - src/ml_kickstarter/constants.py
      - src/ml_kickstarter/data/download.py
      - src/ml_kickstarter/data/features.py
      - src/ml_kickstarter/data/preprocess.py
    outs:
      - data/processed/prepared.csv:
          remote: data
  split:
    cmd: uv run ml-kickstarter split
    deps:
      - pyproject.toml
      - uv.lock
      - data/processed/prepared.csv
      - configs/config.yaml
      - configs/data/kickstarter.yaml
      - configs/split/random.yaml
      - src/ml_kickstarter/commands.py
      - src/ml_kickstarter/constants.py
      - src/ml_kickstarter/data/split.py
    outs:
      - data/splits/train.csv:
          remote: data
      - data/splits/validation.csv:
          remote: data
      - data/splits/test.csv:
          remote: data
  train_baseline:
    cmd: uv run ml-kickstarter train_baseline
    deps:
      - pyproject.toml
      - uv.lock
      - data/splits/train.csv
      - data/splits/validation.csv
      - configs/config.yaml
      - configs/data/kickstarter.yaml
      - configs/split/random.yaml
      - configs/encoding/baseline.yaml
      - configs/train/baseline.yaml
      - configs/logging/mlflow.yaml
      - src/ml_kickstarter/commands.py
      - src/ml_kickstarter/constants.py
      - src/ml_kickstarter/data/encoding.py
      - src/ml_kickstarter/data/features.py
      - src/ml_kickstarter/models/logistic_regression.py
      - src/ml_kickstarter/training/baseline.py
      - src/ml_kickstarter/training/artifacts.py
      - src/ml_kickstarter/training/metrics.py
      - src/ml_kickstarter/training/tracking.py
      - src/ml_kickstarter/training/plots.py
    outs:
      - models/baseline:
          remote: models
      - plots/baseline:
          cache: false
